name: E2E Story Bot

on:
  workflow_dispatch:
    inputs:
      timeout:
        description: 'Story Bot timeout limit in minutes'
        required: false
        default: '20'
      quality:
        description: 'Render quality (low, medium, high)'
        required: false
        default: 'low'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  story-bot:
    name: Run Story Mode E2E Bot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install dependencies
        run: npm ci

      - name: Run Story Bot (SwiftShader software renderer)
        run: |
          node tools/e2e/story-bot.mjs \
            --swiftshader \
            --quality=${{ github.event.inputs.quality || 'low' }} \
            --timeout=${{ github.event.inputs.timeout || '20' }} \
            --no-shots

      - name: Write E2E summary
        if: always()
        run: |
          if [ -f tools/e2e/out/report.json ]; then
            node -e "
              const r = JSON.parse(require('fs').readFileSync('tools/e2e/out/report.json', 'utf8'));
              console.log('### Story Bot E2E Result: ' + (r.passed ? 'PASS' : 'FAIL'));
              console.log('- Step reached:', r.step ?? '-');
              console.log('- Wall time (s):', r.wallSec ?? '-');
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload E2E Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: story-bot-results
          path: tools/e2e/out/
          if-no-files-found: ignore
