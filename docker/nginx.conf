server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  types {
    audio/mp4 m4a;
    image/webp webp;
    application/manifest+json webmanifest;
  }
  include /etc/nginx/mime.types;

  gzip on;
  gzip_types application/javascript application/json text/css text/plain;

  # the page, scripts, styles and data change together on every update: always revalidate (cheap 304s)
  # so a browser never runs an old js/*.js against a new index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
  # images, audio, video: can be cached for a while
  location /assets/ {
    add_header Cache-Control "public, max-age=604800";
  }
}
