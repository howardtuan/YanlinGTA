server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  types {
    audio/mp4 m4a;
    image/webp webp;
  }
  include /etc/nginx/mime.types;

  gzip on;
  gzip_types application/javascript application/json text/css text/plain;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
