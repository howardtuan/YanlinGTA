<g id="plan-notes">
  <path d="M41.75 477H786.05" stroke="#cbd1d8" stroke-width=".7"/>
  <text x="41.75" y="496" font-size="11" font-weight="700">配置與動線</text>
  <g font-size="8.5">
    <text x="41.75" y="513">培英廳｜由大門進入服務台所在的通道，再經正門入廳。舞台在西側，座位向東逐排升高。</text>
    <text x="41.75" y="529">側走廊｜沿培英廳北側通往女廁與男廁。原創咖啡位於培英廳南側，正門朝東。</text>
    <text x="41.75" y="545">主走廊｜101 邱林信貞全球交誼廳的入口朝南接主走廊。郵局位於東北側，麥當勞位於東南側。</text>
    <text x="41.75" y="561">樓層動線｜旋轉樓梯連接地下一樓與二樓。直跑樓梯由左往右上行至二樓。</text>
  </g>
  <text x="41.75" y="585" font-size="11" font-weight="700">圖例</text>
