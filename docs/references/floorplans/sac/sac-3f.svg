<g id="plan-notes">
<path d="M17 465H866" fill="none" stroke="#cbd1d8" stroke-width="0.7"/>
<text x="17" y="483" text-anchor="start" font-size="11" fill="#25262a">配置與動線</text>
<text x="17" y="500" text-anchor="start" font-size="9" fill="#25262a">北側女廁與男廁共用兩階入口。招待所入口有門禁，西南側樓梯間與電梯位於透明玻璃自動門內側。</text>
<text x="17" y="516" text-anchor="start" font-size="9" fill="#25262a">二樓上來的樓梯向東抵達迴廊。中央挑空南、北兩側各有一座往四樓的樓梯。北側走廊另一端與西南側也各有一座。</text>
<text x="17" y="532" text-anchor="start" font-size="9" fill="#00747a">鏡面配置：活動平台東側、312 東側、課指組西側共三處，每處各為一整片全身鏡。</text>
<text x="17" y="548" text-anchor="start" font-size="9" fill="#25262a">白色區塊表示室內細部未繪製。手繪稿未標尺寸的隔牆、門位與鏡面依相對位置配置。</text>
